<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="Target belajar: 4 dari 4 selesai">
  <defs>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.5" fill="#000" opacity="0.28"/></pattern>
  </defs>
  <rect width="900" height="270" fill="#0b0f1a"/>
  <rect x="48" y="28" width="820" height="230" fill="#ffc857" opacity="0.25"/>
  <rect x="40" y="20" width="820" height="230" fill="#121829" stroke="#ffc857" stroke-width="3"/>
  <rect x="40" y="20" width="820" height="30" fill="#ffc857"/>
  <text x="54" y="41" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold" fill="#0b0f1a">misi.log  -  4/4 selesai</text>

  <g font-family="'Courier New',Courier,monospace" font-size="16" fill="#e6e9f5">
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.4s" fill="freeze"/>
      <rect x="70" y="74" width="20" height="20" fill="none" stroke="#4de0d0" stroke-width="2"/>
      <path d="M74 84 L79 89 L88 78" fill="none" stroke="#4de0d0" stroke-width="3" stroke-dasharray="24" stroke-dashoffset="24"><animate attributeName="stroke-dashoffset" from="24" to="0" begin="0.5s" dur="0.4s" fill="freeze"/></path>
      <text x="108" y="90">Bikin proyek pertama dan menaruhnya di GitHub</text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.4s" fill="freeze"/>
      <rect x="70" y="109" width="20" height="20" fill="none" stroke="#4de0d0" stroke-width="2"/>
      <path d="M74 119 L79 124 L88 113" fill="none" stroke="#4de0d0" stroke-width="3" stroke-dasharray="24" stroke-dashoffset="24"><animate attributeName="stroke-dashoffset" from="24" to="0" begin="1.4s" dur="0.4s" fill="freeze"/></path>
      <text x="108" y="125">Rapikan README di setiap proyek</text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.4s" fill="freeze"/>
      <rect x="70" y="144" width="20" height="20" fill="none" stroke="#4de0d0" stroke-width="2"/>
      <path d="M74 154 L79 159 L88 148" fill="none" stroke="#4de0d0" stroke-width="3" stroke-dasharray="24" stroke-dashoffset="24"><animate attributeName="stroke-dashoffset" from="24" to="0" begin="2.3s" dur="0.4s" fill="freeze"/></path>
      <text x="108" y="160">Latihan Python sedikit demi sedikit setiap minggu</text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3s" dur="0.4s" fill="freeze"/>
      <rect x="70" y="179" width="20" height="20" fill="none" stroke="#4de0d0" stroke-width="2"/>
      <path d="M74 189 L79 194 L88 183" fill="none" stroke="#4de0d0" stroke-width="3" stroke-dasharray="24" stroke-dashoffset="24"><animate attributeName="stroke-dashoffset" from="24" to="0" begin="3.2s" dur="0.4s" fill="freeze"/></path>
      <text x="108" y="195">Bikin satu proyek machine learning, dari awal sampai tampil di web</text></g>
  </g>

  <g transform="translate(790 215) rotate(-10)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0.5;1" keyTimes="0;0.01;0.02;0.5;1" begin="4s" dur="1.6s" fill="freeze" repeatCount="indefinite"/>
    <rect x="-46" y="-17" width="92" height="34" fill="none" stroke="#ff4fa3" stroke-width="3" filter="url(#g)"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="17" font-weight="bold" fill="#ff4fa3" filter="url(#g)">SELESAI</text>
  </g>

  <text x="70" y="232" font-family="'Courier New',Courier,monospace" font-size="13" fill="#4de0d0">4/4 misi selesai - siap naik level</text>
  <rect x="40" y="20" width="820" height="230" fill="url(#scan)"/>
</svg>
