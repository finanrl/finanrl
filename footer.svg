    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.5" fill="#000" opacity="0.3"/></pattern>
    <clipPath id="c1"><rect x="70" y="62" width="0" height="22"><animate attributeName="width" from="0" to="440" begin="0.3s" dur="1.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="70" y="90" width="0" height="22"><animate attributeName="width" from="0" to="440" begin="1.8s" dur="1s" fill="freeze"/></rect></clipPath>
  </defs>
  <rect width="900" height="160" fill="#07080a"/>
  <polygon points="40,12 840,12 860,32 860,148 60,148 40,128" fill="#0f1115" stroke="#ff5a1f" stroke-width="2"/>
  <rect x="60" y="16" width="770" height="6" fill="url(#haz)"/>
  <text x="70" y="44" font-family="'Courier New',Courier,monospace" font-size="14" fill="#ff5a1f">// kontak</text>
  <g font-family="'Courier New',Courier,monospace" font-size="16">
    <text clip-path="url(#c1)" x="70" y="79" fill="#f2f4f8"><tspan fill="#7fd8ff">email</tspan> : finanurilaulia2104@gmail.com</text>
    <text clip-path="url(#c2)" x="70" y="107" fill="#f2f4f8"><tspan fill="#7fd8ff">ig   </tspan> : @finanrl_</text>
  </g>
  <rect x="282" y="92" width="10" height="18" fill="#ff5a1f" opacity="0"><animate attributeName="opacity" values="1;0;1" dur="1s" begin="2.8s" repeatCount="indefinite"/></rect>
  <line x1="60" y1="120" x2="850" y2="120" stroke="#1d222b" stroke-width="2"/>
  <text x="70" y="139" font-family="'Courier New',Courier,monospace" font-size="12" fill="#8a94a6">(c) 2026 FINA NURIL AULIA  |  masih belajar, masih naik level</text>
