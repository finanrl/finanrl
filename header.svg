<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Fina Nuril Aulia - web dan machine learning">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#12151b" stroke-width="1"/></pattern>
    <pattern id="haz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#ff5a1f"/></pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.5" fill="#000" opacity="0.3"/></pattern>
    <clipPath id="c0"><rect x="70" y="52" width="0" height="24"><animate attributeName="width" from="0" to="190" begin="0.3s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="c1"><rect x="70" y="86" width="0" height="48"><animate attributeName="width" from="0" to="430" begin="1.3s" dur="1.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="70" y="144" width="0" height="28"><animate attributeName="width" from="0" to="300" begin="3.1s" dur="1.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="70" y="183" width="0" height="26"><animate attributeName="width" from="0" to="450" begin="4.5s" dur="1.8s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="900" height="300" fill="#07080a"/>
  <rect width="900" height="300" fill="url(#grid)"/>
  <polygon points="40,20 840,20 860,40 860,270 60,270 40,250" fill="#0f1115" stroke="#ff5a1f" stroke-width="2"/>
  <rect x="60" y="24" width="770" height="6" fill="url(#haz)"/>
  <rect x="52" y="56" width="5" height="170" fill="#ff5a1f"/>

  <g font-family="'Courier New',Courier,monospace">
    <text clip-path="url(#c0)" x="70" y="70" font-size="16" fill="#ff5a1f">root@fina:~$ whoami</text>
    <text clip-path="url(#c1)" x="70" y="125" font-size="44" font-weight="bold" fill="#f2f4f8">FINA NURIL AULIA</text>
    <text clip-path="url(#c2)" x="70" y="165" font-size="22" fill="#7fd8ff">web + machine learning</text>
    <text clip-path="url(#c3)" x="70" y="200" font-size="17" fill="#8a94a6">status: pemula, tapi nggak berhenti belajar</text>
  </g>
  <rect x="513" y="185" width="10" height="20" fill="#ff5a1f" opacity="0">
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="6.4s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(730 150)" fill="none">
    <circle r="80" stroke="#1d222b" stroke-width="2"/>
    <circle r="64" stroke="#ff5a1f" stroke-width="3" stroke-dasharray="6 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="46" stroke="#7fd8ff" stroke-width="2" stroke-dasharray="40 14">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <path d="M-92 0H-72M72 0H92M0 -92V-72M0 72V92" stroke="#8a94a6" stroke-width="2"/>
    <text y="9" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="26" font-weight="bold" fill="#f2f4f8" stroke="none">LV.1</text>
  </g>

  <line x1="60" y1="246" x2="850" y2="246" stroke="#1d222b" stroke-width="2"/>
  <circle cx="72" cy="259" r="4" fill="#ff5a1f"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
  <text x="86" y="263" font-family="'Courier New',Courier,monospace" font-size="12" fill="#8a94a6">[ ONLINE ]  github.com/finanrl  |  (c) 2026</text>
  <polygon points="40,20 840,20 860,40 860,270 60,270 40,250" fill="url(#scan)"/>
    <g font-family="'Courier New',Courier,monospace" font-size="44" font-weight="bold">
    <text x="70" y="125" fill="#7fd8ff" opacity="0">FINA NURIL AULIA
      <animate attributeName="opacity" values="0;0.85;0;0.6;0;0" keyTimes="0;0.02;0.05;0.08;0.11;1" dur="5s" begin="3.4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="70;65;75;68;70;70" keyTimes="0;0.02;0.05;0.08;0.11;1" dur="5s" begin="3.4s" repeatCount="indefinite"/>
    </text>
    <text x="70" y="125" fill="#ff5a1f" opacity="0">FINA NURIL AULIA
      <animate attributeName="opacity" values="0;0.85;0;0.6;0;0" keyTimes="0;0.02;0.05;0.08;0.11;1" dur="5s" begin="3.4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="70;76;64;72;70;70" keyTimes="0;0.02;0.05;0.08;0.11;1" dur="5s" begin="3.4s" repeatCount="indefinite"/>
    </text>
  </g>
  <g transform="translate(730 150)">
    <line x1="0" y1="0" x2="0" y2="-78" stroke="#7fd8ff" stroke-width="2" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
