<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Progress belajar">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.5" fill="#000" opacity="0.28"/></pattern>
  </defs>
  <rect width="900" height="240" fill="#0b0f1a"/>
  <rect x="48" y="28" width="820" height="200" fill="#4de0d0" opacity="0.25"/>
  <rect x="40" y="20" width="820" height="200" fill="#121829" stroke="#4de0d0" stroke-width="3"/>
  <rect x="40" y="20" width="820" height="30" fill="#4de0d0"/>
  <text x="54" y="41" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold" fill="#0b0f1a">belajar.log</text>

  <g font-family="'Courier New',Courier,monospace" font-size="16" fill="#e6e9f5">
    <text x="70" y="88">HTML</text>
    <text x="70" y="120">Python</text>
    <text x="70" y="152">Machine Learning</text>
    <text x="70" y="184">Git</text>
  </g>

  <g fill="#1d2540" stroke="#2d3760" stroke-width="2">
    <rect x="270" y="75" width="400" height="14"/><rect x="270" y="107" width="400" height="14"/>
    <rect x="270" y="139" width="400" height="14"/><rect x="270" y="171" width="400" height="14"/>
  </g>
  <rect x="270" y="75" width="0" height="14" fill="#ff4fa3"><animate attributeName="width" from="0" to="240" begin="0.3s" dur="1.2s" fill="freeze"/></rect>
  <rect x="270" y="107" width="0" height="14" fill="#4de0d0"><animate attributeName="width" from="0" to="160" begin="0.6s" dur="1.2s" fill="freeze"/></rect>
  <rect x="270" y="139" width="0" height="14" fill="#ffc857"><animate attributeName="width" from="0" to="100" begin="0.9s" dur="1.2s" fill="freeze"/></rect>
  <rect x="270" y="171" width="0" height="14" fill="#ff4fa3"><animate attributeName="width" from="0" to="120" begin="1.2s" dur="1.2s" fill="freeze"/></rect>

  <g font-family="'Courier New',Courier,monospace" font-size="16" font-weight="bold" fill="#ffc857">
    <text x="690" y="88">60%</text><text x="690" y="120">40%</text>
    <text x="690" y="152">25%</text><text x="690" y="184">30%</text>
  </g>
  <text x="70" y="208" font-family="'Courier New',Courier,monospace" font-size="12" fill="#4de0d0">pemula itu bukan masalah, yang penting jalan terus</text>
  <rect x="40" y="20" width="820" height="200" fill="url(#scan)"/>
</svg>
