<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Progress belajar">
  <defs>
    <pattern id="haz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#ff5a1f"/></pattern>
    <pattern id="seg" width="10" height="14" patternUnits="userSpaceOnUse"><rect x="8" width="2" height="14" fill="#0f1115"/></pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.5" fill="#000" opacity="0.3"/></pattern>
  </defs>
  <rect width="900" height="240" fill="#07080a"/>
  <polygon points="40,20 840,20 860,40 860,220 60,220 40,200" fill="#0f1115" stroke="#ff5a1f" stroke-width="2"/>
  <rect x="60" y="24" width="770" height="6" fill="url(#haz)"/>
  <text x="70" y="52" font-family="'Courier New',Courier,monospace" font-size="14" fill="#ff5a1f">// belajar.log</text>

  <g font-family="'Courier New',Courier,monospace" font-size="16" fill="#f2f4f8">
    <text x="70" y="88">HTML</text><text x="70" y="120">Python</text>
    <text x="70" y="152">Machine Learning</text><text x="70" y="184">Git</text>
  </g>

  <g fill="#1a1e26">
    <rect x="270" y="75" width="400" height="14"/><rect x="270" y="107" width="400" height="14"/>
    <rect x="270" y="139" width="400" height="14"/><rect x="270" y="171" width="400" height="14"/>
  </g>
  <rect x="270" y="75" width="0" height="14" fill="#ff5a1f"><animate attributeName="width" from="0" to="240" begin="0.3s" dur="1.2s" fill="freeze"/></rect>
  <rect x="270" y="107" width="0" height="14" fill="#7fd8ff"><animate attributeName="width" from="0" to="160" begin="0.6s" dur="1.2s" fill="freeze"/></rect>
  <rect x="270" y="139" width="0" height="14" fill="#ff5a1f"><animate attributeName="width" from="0" to="100" begin="0.9s" dur="1.2s" fill="freeze"/></rect>
  <rect x="270" y="171" width="0" height="14" fill="#7fd8ff"><animate attributeName="width" from="0" to="120" begin="1.2s" dur="1.2s" fill="freeze"/></rect>
  <g fill="url(#seg)">
    <rect x="270" y="75" width="400" height="14"/><rect x="270" y="107" width="400" height="14"/>
    <rect x="270" y="139" width="400" height="14"/><rect x="270" y="171" width="400" height="14"/>
  </g>

  <g font-family="'Courier New',Courier,monospace" font-size="16" font-weight="bold" fill="#f2f4f8">
    <text x="690" y="88">60%</text><text x="690" y="120">40%</text>
    <text x="690" y="152">25%</text><text x="690" y="184">30%</text>
  </g>
  <text x="70" y="208" font-family="'Courier New',Courier,monospace" font-size="12" fill="#8a94a6">// pemula itu bukan masalah, yang penting jalan terus</text>
  <polygon points="40,20 840,20 860,40 860,220 60,220 40,200" fill="url(#scan)"/>
</svg>
